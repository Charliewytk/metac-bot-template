name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline dry-run and unit tests
        run: |
          python -m unittest discover -s tests -v
          python dry_run.py
        # No secrets. These tests never call Metaculus write endpoints.
